<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>下麻 手牌判定デバッグ</title>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 18px;
    }

    .panel {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      font: inherit;
    }

    .action {
      border: 1px solid #555;
      background: #282828;
      color: #fff;
      border-radius: 8px;
      padding: 7px 11px;
      cursor: pointer;
    }

    .action:hover {
      background: #333;
    }

    .info {
      color: #aaa;
      font-size: 13px;
    }

    #tileGrid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(58px, 1fr));
      gap: 6px;
    }

    .tileBtn {
      position: relative;
      min-height: 54px;
      border: 1px solid #444;
      background: #252525;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .tileBtn:hover {
      background: #313131;
    }

    .tileBtn .count {
      position: absolute;
      right: 4px;
      top: 2px;
      min-width: 16px;
      height: 16px;
      line-height: 16px;
      border-radius: 8px;
      background: #555;
      font-size: 11px;
    }

    .tileBtn.has .count {
      background: #7c5;
      color: #111;
    }

    #hand {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 66px;
      align-items: center;
    }

    .handTile {
      width: 44px;
      height: 58px;
      border: 1px solid #888;
      border-radius: 6px;
      background: #f3f0e8;
      color: #111;
      display: grid;
      place-items: center;
      font-size: 24px;
      cursor: pointer;
    }

    .handTile:hover {
      transform: translateY(-2px);
    }

    .badgeRow {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(145px, 1fr));
      gap: 8px;
    }

    .badge {
      border: 1px solid #333;
      border-radius: 9px;
      padding: 10px;
      background: #151515;
    }

    .badge .label {
      color: #999;
      font-size: 12px;
    }

    .badge .value {
      font-size: 18px;
      margin-top: 3px;
    }

    .ok {
      color: #9fd37d;
    }

    .ng {
      color: #e58c8c;
    }

    .warn {
      color: #e6c06d;
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid #333;
      padding: 6px 7px;
      text-align: left;
    }

    .empty {
      color: #777;
    }

    @media (max-width: 700px) {
      main {
        padding: 12px;
      }

      #tileGrid {
        grid-template-columns:
          repeat(8, minmax(0, 1fr));
      }

      .tileBtn {
        min-height: 46px;
      }
    }

    /* 役の分析 */
    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .opts label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: #ccc;
    }

    .opts input[type="number"],
    .opts select {
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 6px;
    }

    .opts input[type="number"] {
      width: 64px;
    }

    .decomp {
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #151515;
    }

    .decomp.best {
      border-color: #3a7;
    }

    .wordChip {
      display: inline-block;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 3px 8px;
      margin: 2px 4px 2px 0;
    }

    .wordChip small {
      color: #aaa;
      margin-left: 6px;
    }

    .scoreLine {
      margin-top: 6px;
      color: #ccc;
      font-size: 14px;
    }

    .waitChip {
      display: inline-block;
      background: #1d2b22;
      border: 1px solid #3a7;
      border-radius: 8px;
      padding: 3px 10px;
      margin: 2px 4px 2px 0;
      font-size: 18px;
    }

    table.mini {
      border-collapse: collapse;
      width: 100%;
    }

    table.mini th,
    table.mini td {
      border-bottom: 1px solid #2a2a2a;
      padding: 5px 8px;
      text-align: left;
      vertical-align: top;
    }
  </style>
</head>

<body>
<main>

  <h1>下麻 手牌判定デバッグ</h1>

  <div class="sub">
    実戦画面とは独立して、現在のサーバー判定エンジンに
    手牌を渡して確認します。
  </div>

  <section class="panel">
    <h2>操作</h2>

    <div class="toolbar">

      <button class="action" id="clearBtn">
        手牌をクリア
      </button>

      <button class="action" id="random13Btn">
        ランダム13枚
      </button>

      <button class="action" id="random14Btn">
        ランダム14枚
      </button>

      <span class="info">
        牌をクリックで1枚追加。
        下の手牌をクリックするとその1枚を削除。
      </span>

    </div>
  </section>

  <section class="panel">
    <h2>役の分析の条件</h2>

    <div class="opts">
      <label><input type="checkbox" id="optRiichi">リーチ</label>
      <label><input type="checkbox" id="optIppatsu">一発</label>
      <label><input type="checkbox" id="optDealer">親</label>
      <label>
        和了方法
        <select id="optWinType">
          <option value="tsumo">ツモ</option>
          <option value="ron">ロン</option>
        </select>
      </label>
      <label>
        ドラ枚数
        <input type="number" id="optDora" min="0" max="14" value="0">
      </label>
    </div>
  </section>

  <section class="panel">
    <h2>
      現在の手牌
      <span id="handCount">0/14</span>
    </h2>

    <div id="hand" class="empty">
      牌を追加してください
    </div>
  </section>

  <section class="panel">
    <h2>判定結果</h2>

    <div class="badgeRow">

      <div class="badge">
        <div class="label">牌数</div>
        <div id="lengthResult" class="value">-</div>
      </div>

      <div class="badge">
        <div class="label">和了</div>
        <div id="winResult" class="value">-</div>
      </div>

      <div class="badge">
        <div class="label">テンパイ</div>
        <div id="tenpaiResult" class="value">-</div>
      </div>

      <div class="badge">
        <div class="label">リーチ可能</div>
        <div id="riichiResult" class="value">-</div>
      </div>

      <div class="badge">
        <div class="label">辞書登録数</div>
        <div id="dictResult" class="value">-</div>
      </div>

      <div class="badge">
        <div class="label">牌種類数</div>
        <div id="kindResult" class="value">-</div>
      </div>

    </div>

    <div style="margin-top:12px">
      <div id="status" class="info">
        待機中
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>待ち牌 / 切ればテンパイになる打牌</h2>

    <div id="waits" class="mono empty">
      -
    </div>
  </section>

  <section class="panel">
    <h2>和了分解と役の分析</h2>

    <div id="decompositions" class="mono empty">
      -
    </div>
  </section>

  <section class="panel">
    <h2>辞書</h2>

    <div id="dictionarySummary" class="info">
      -
    </div>

    <details style="margin-top:8px">

      <summary>
        辞書の内容を表示
      </summary>

      <div
        id="dictionary"
        style="margin-top:8px"
      ></div>

    </details>
  </section>

  <section class="panel">
    <h2>牌一覧</h2>
    <div id="tileGrid"></div>
  </section>

</main>

<script>
const SEION = [
  'あ','い','う','え','お',
  'か','き','く','け','こ',
  'さ','し','す','せ','そ',
  'た','ち','つ','て','と',
  'な','に','ぬ','ね','の',
  'は','ひ','ふ','へ','ほ',
  'ま','み','む','め','も',
  'や','ゆ','よ',
  'ら','り','る','れ','ろ',
  'わ','を','ん'
];

const DAKUTEN = [
  'が','ぎ','ぐ','げ','ご',
  'ざ','じ','ず','ぜ','ぞ',
  'だ','ぢ','づ','で','ど',
  'ば','び','ぶ','べ','ぼ',
  'ぱ','ぴ','ぷ','ぺ','ぽ',
  'ゔ'
];

const SMALL = [
  'ぁ','ぃ','ぅ','ぇ','ぉ',
  'っ','ゃ','ゅ','ょ'
];

const CHOON = ['ー'];

const ALL_TILES = [
  ...SEION,
  ...DAKUTEN,
  ...SMALL,
  ...CHOON
];

let hand = [];
let timer = null;

const $ = (id) =>
  document.getElementById(id);

function setResult(el, value, cls = '') {
  el.textContent = value;
  el.className = 'value ' + cls;
}

function renderHand() {
  $('handCount').textContent =
    `${hand.length}/14`;

  const root = $('hand');

  if (!hand.length) {
    root.className = 'empty';
    root.textContent =
      '牌を追加してください';
    return;
  }

  root.className = '';

  root.innerHTML =
    hand.map((kind, index) =>
      `
      <button
        class="handTile"
        title="クリックで削除"
        data-index="${index}"
      >
        ${kind}
      </button>
      `
    ).join('');

  root
    .querySelectorAll('[data-index]')
    .forEach((btn) => {

      btn.addEventListener('click', () => {

        hand.splice(
          Number(btn.dataset.index),
          1
        );

        renderHand();
        renderTiles();
        scheduleCheck();
      });

    });
}

function renderTiles() {

  $('tileGrid').innerHTML =
    ALL_TILES.map((kind) => {

      const count =
        hand.filter((x) => x === kind)
          .length;

      return `
        <button
          class="tileBtn ${count ? 'has' : ''}"
          data-kind="${kind}"
        >
          ${kind}
          <span class="count">
            ${count}
          </span>
        </button>
      `;

    }).join('');

  $('tileGrid')
    .querySelectorAll('[data-kind]')
    .forEach((btn) => {

      btn.addEventListener('click', () => {

        if (hand.length >= 14) {
          return;
        }

        hand.push(btn.dataset.kind);

        renderHand();
        renderTiles();
        scheduleCheck();
      });

    });
}

function randomHand(length) {

  hand = [];

  for (let i = 0; i < length; i++) {

    hand.push(
      ALL_TILES[
        Math.floor(
          Math.random() *
          ALL_TILES.length
        )
      ]
    );

  }

  renderHand();
  renderTiles();
  scheduleCheck();
}

function resetResults() {

  setResult(
    $('lengthResult'),
    `${hand.length}枚`
  );

  setResult(
    $('winResult'),
    '-'
  );

  setResult(
    $('tenpaiResult'),
    '-'
  );

  setResult(
    $('riichiResult'),
    '-'
  );

  setResult(
    $('dictResult'),
    '-'
  );

  setResult(
    $('kindResult'),
    '-'
  );

  $('waits').textContent = '-';
  $('waits').className =
    'mono empty';

  $('decompositions').textContent = '-';
  $('decompositions').className =
    'mono empty';

  $('dictionarySummary').textContent = '-';

  $('dictionary').innerHTML = '';
}

function scheduleCheck() {

  clearTimeout(timer);

  timer = setTimeout(
    check,
    180
  );
}

function readOptions() {
  return {
    riichi: $('optRiichi').checked,
    ippatsu: $('optIppatsu').checked,
    isDealer: $('optDealer').checked,
    winType: $('optWinType').value,
    doraCount: Number($('optDora').value) || 0
  };
}

function yn(value, okText = '○', ngText = '×') {
  return value ? okText : ngText;
}

function hanText(h) {
  return h === 'y' ? '役満' : `${h}飜`;
}

function wordChips(words) {
  return words.map((w) =>
    `<span class="wordChip">${escapeHtml(w.word)}<small>${
      w.inDict ? hanText(w.han) : '辞書なし'
    }${
      w.tags.length
        ? ' / ' + escapeHtml(w.tags.join(' '))
        : ''
    }</small></span>`
  ).join('');
}

// 1つの和了分解(単語・役の内訳・符/飜/点数)を表示する
function decompHtml(d, isBest) {
  const sc = d.score;

  const breakdown = sc.baseHanBreakdown
    .map((b) => `${escapeHtml(b.label)} ${hanText(b.han)}`)
    .join('　＋　');

  const pay = sc.payments;
  const payText =
    pay.fromDealer !== undefined || pay.fromNonDealer !== undefined
      ? `ツモ: 親 ${pay.fromDealer ?? '-'} / 子 ${pay.fromNonDealer ?? '-'}（合計 ${pay.total}点）`
      : `ロン: ${pay.total}点`;

  return `
    <div class="decomp ${isBest ? 'best' : ''}">
      ${isBest ? '<div class="ok">★ 最も高い点数の分解</div>' : ''}
      <div>${wordChips(d.words)}</div>
      <div class="scoreLine">役: ${breakdown || '（なし）'}</div>
      <div class="scoreLine">
        ${sc.fu}符 ${sc.han}飜${
          sc.limitName ? ' ／ <b>' + escapeHtml(sc.limitName) + '</b>' : ''
        }${sc.isChiitoi ? ' ／ 七対子形' : ''}　→　${payText}
      </div>
    </div>`;
}

function winHtml(win) {
  if (!win.possible) {
    return '<span class="ng">分解できません（和了形ではありません）</span>';
  }

  return win.decompositions
    .map((d, i) => decompHtml(d, i === win.bestIndex))
    .join('');
}

// サーバーの分析結果(analysis)を画面に出す。13枚・14枚で同じ項目を同じ定義で表示する。
function renderAnalysis(a) {
  const is13 = a.length === 13;
  const is14 = a.length === 14;

  // 和了: 14枚の時だけ判定できる
  setResult(
    $('winResult'),
    is14 ? yn(a.win.possible) : '-（14枚で判定）',
    is14 ? (a.win.possible ? 'ok' : 'ng') : ''
  );

  // テンパイ:
  //  13枚 = 待ちがある / 14枚 = 切ればテンパイになる打牌がある(和了形も含む)
  setResult(
    $('tenpaiResult'),
    yn(a.tenpai.possible),
    a.tenpai.possible ? 'ok' : 'ng'
  );

  // リーチ可能: 13枚 = テンパイしている / 14枚 = 切ればテンパイになる打牌がある
  setResult(
    $('riichiResult'),
    yn(a.riichi.possible),
    a.riichi.possible ? 'ok' : 'ng'
  );

  // 待ち牌 / 打牌候補
  if (is13) {
    $('waits').className = 'mono ' + (a.tenpai.waits.length ? 'ok' : 'ng');

    $('waits').innerHTML = a.tenpai.waits.length
      ? '待ち牌: ' +
        a.tenpai.waits.map((k) => `<span class="waitChip">${escapeHtml(k)}</span>`).join('')
      : '待ちなし（テンパイしていません）';
  } else if (is14) {
    $('waits').className = 'mono ' + (a.discards.length ? 'ok' : 'ng');

    $('waits').innerHTML = a.discards.length
      ? `<table class="mini">
           <thead><tr><th>切る牌</th><th>切った後の待ち牌</th></tr></thead>
           <tbody>${
             a.discards.map((d) =>
               `<tr><td>${escapeHtml(d.discard)}</td><td>${
                 d.waits.map((k) => `<span class="waitChip">${escapeHtml(k)}</span>`).join('')
               }</td></tr>`
             ).join('')
           }</tbody>
         </table>`
      : '切ればテンパイになる打牌がありません';
  }

  // 和了分解と役の分析
  if (is14) {
    $('decompositions').className = 'mono';
    $('decompositions').innerHTML = winHtml(a.win);
  } else if (is13) {
    $('decompositions').className = 'mono';

    $('decompositions').innerHTML = a.tenpai.waitDetails.length
      ? a.tenpai.waitDetails.map((w) => `
          <div style="margin-bottom:14px">
            <div><span class="waitChip">${escapeHtml(w.kind)}</span> で和了したとき</div>
            ${winHtml(w.win)}
          </div>`).join('')
      : '<span class="ng">待ちがないため、役の分析はありません</span>';
  }
}

async function check() {

  resetResults();

  if (
    hand.length !== 13 &&
    hand.length !== 14
  ) {

    $('status').textContent =
      '13枚または14枚にすると、和了・テンパイ・リーチ可能・役の分析を行います。';

    $('status').className =
      'info';

    return;
  }

  $('status').textContent =
    '判定中…';

  $('status').className =
    'info';

  try {

    const res = await fetch(
      '/api/debug/hand-check',
      {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type':
            'application/json'
        },
        body: JSON.stringify({
          hand,
          options: readOptions()
        }),
      }
    );

    const text = await res.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        `サーバーがJSONではなくHTTP ${res.status}を返しました`
      );
    }

    if (!res.ok) {
      throw new Error(
        data.error ||
        `HTTP ${res.status}`
      );
    }

    setResult(
      $('lengthResult'),
      `${data.handLength}枚`
    );

    setResult(
      $('dictResult'),
      `${data.dictionaryCount}語`,
      data.dictionaryCount > 0
        ? 'ok'
        : 'ng'
    );

    setResult(
      $('kindResult'),
      `${data.tileKindCount}種類`,
      data.tileKindCount === 82
        ? 'ok'
        : 'warn'
    );

    renderAnalysis(data.analysis);

    $('dictionarySummary').textContent =
      `DBから ${data.dictionaryCount} 語を読み込みました。`;

    if (data.dictionaryCount === 0) {

      $('dictionarySummary').innerHTML =
        `
        <span class="ng">
          辞書が0件です。
          D1の words テーブル読み込みを疑ってください。
        </span>
        `;
    }

    $('dictionary').innerHTML =
      data.dictionary.length

        ? `
          <table>
            <thead>
              <tr>
                <th>word</th>
                <th>han</th>
                <th>tag</th>
              </tr>
            </thead>

            <tbody>

              ${
                data.dictionary
                  .map(d =>
                    `
                    <tr>
                      <td>
                        ${escapeHtml(d.word)}
                      </td>

                      <td>
                        ${escapeHtml(String(d.han))}
                      </td>

                      <td>
                        ${escapeHtml(
                          (d.tag || []).join(' ')
                        )}
                      </td>
                    </tr>
                    `
                  )
                  .join('')
              }

            </tbody>
          </table>
          `

        : `
          <span class="ng">
            辞書なし
          </span>
          `;

    $('status').textContent =
      '判定完了';

    $('status').className =
      'ok';

  } catch (err) {

    $('status').textContent =
      `エラー: ${err.message || err}`;

    $('status').className =
      'ng';
  }
}

function escapeHtml(value) {

  return value.replace(
    /[&<>"']/g,
    (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]
  );
}

$('clearBtn')
  .addEventListener(
    'click',
    () => {

      hand = [];

      renderHand();
      renderTiles();
      scheduleCheck();
    }
  );

$('random13Btn')
  .addEventListener(
    'click',
    () => randomHand(13)
  );

$('random14Btn')
  .addEventListener(
    'click',
    () => randomHand(14)
  );

['optRiichi', 'optIppatsu', 'optDealer', 'optWinType', 'optDora']
  .forEach((id) => {
    $(id).addEventListener('change', scheduleCheck);
    $(id).addEventListener('input', scheduleCheck);
  });

renderHand();
renderTiles();
resetResults();

$('status').textContent =
  '準備完了';
</script>

</body>
</html>
